# The curated local-model catalog (M16.3a).
#
# Every entry is pinned to something immutable: `revision` is a git commit
# on the publisher's Hugging Face repository, `sha256` is the file's own
# digest, and `size_bytes` is exact. Nothing here follows a branch, a tag
# that can move, or "latest" - a new upstream build is a reviewed change to
# this file (docs/adr/0005-guided-local-model-setup.md), never a silent one.
#
# Only publisher-owned artifacts are listed. All three entries below are
# published by Qwen themselves under Apache-2.0, which is AGPL-compatible;
# no community requantization appears here, and adding one would be an
# explicit trust decision recorded in the ADR, not an edit to this file.
#
# HOW THE NUMBERS WERE OBTAINED - and how to refresh them, in
# docs/LOCAL_MODEL_MAINTENANCE.md:
#
#   revision/sha256/size_bytes  Hugging Face's tree API. `sha256` is the
#                               LFS object id, which *is* the file digest,
#                               so it is verifiable without downloading.
#   kv_cache_bytes              exact arithmetic over the artifact's own
#                               GGUF header (read with a range request):
#                               ctx x layers x kv_heads x (k_len + v_len)
#                               x 2 bytes. Marked `computed`.
#   runtime_overhead_bytes      1 GiB + 8% of the weight file. A documented
#                               conservative rule, marked `estimated` -
#                               llama.cpp's compute buffers are not
#                               derivable from the header, and pretending
#                               otherwise would put a guess and a
#                               measurement in the same column.
#
# `support_status: provisional` on every entry is deliberate and honest.
# The pinning, the licence review, and the memory arithmetic are done; the
# Syzygy-specific evaluation (M16.3b: schema-valid rate, repair rate,
# fidelity rubric, tokens/second on representative hardware) has not been
# run. Until it is, the wizard says "not yet measured by Syzygy" instead of
# implying evidence that does not exist, and the recommendation's
# confidence stays low.

schema: local-model-catalog-v1

# Bumped on any change to an entry. Persisted alongside a license
# acceptance, so changed terms are asked about again rather than inherited.
catalog_version: "2026-08-08"

# The context every profile below is computed at. Must equal
# `syzygy.local_models.fit.SYZYGY_CONTEXT_TOKENS`; the loader checks.
profile_context_tokens: 8192

