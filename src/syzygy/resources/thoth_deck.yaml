# Canonical Crowley-Harris Thoth Tarot deck data for Syzygy.
#
# Source-grounded against docs/book_of_thoth.pdf during the initial
# architecture session (2026-08-07). See docs/THOTH_INGESTION_MAP.md
# section 11 for citations of the specific Thoth-only attributions
# (the Tzaddi/Heh swap, the Aeon's Spirit element, the Princesses'
# lack of zodiacal attribution, and the counter-elemental court-card
# decan spans) that a generic tarot-astrology reference would get
# wrong. Do not regenerate this file from model memory; if it needs
# correction, verify against the PDF or another primary source and
# update docs/THOTH_INGESTION_MAP.md accordingly.
#
# Field notes:
# - arcana: 'major' | 'minor'
# - suit: null for majors; one of wands/cups/swords/disks for minors
# - rank: 1-10 for numbered minors; null for majors and court cards
# - court: null except knight/queen/prince/princess court cards
# - astrology.type: 'element' | 'planet' | 'sign' | 'decan' (numbered
#   minors) | 'court_decan_span' (court cards) | null (Aces; Princesses)
# - qabalah.path_number uses Golden Dawn numbering (paths 11-32 map
#   Aleph-Tau in Hebrew alphabetical order onto the Tree of Life)
# - No card has an 'orientation' field: v0.1 draws upright cards only
#   (see DESIGN.md section 8.1); do not add reversal support here.

