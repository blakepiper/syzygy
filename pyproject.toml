[project]
name = "syzygy"
version = "0.1.0"
description = "A local-first TUI for a daily divination ritual combining a natal chart, current astrological transits, and a random Thoth Tarot draw, interpreted by an LLM."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Blake Piper" }]

# Python-version note: Kerykeion 5.x declares support for 3.10-3.13 only
# (no 3.14 classifier). Textual is nominally >=3.9,<4.0 but has a known
# asyncio event-loop-policy regression on 3.14 (see AGENTS.md). The upper
# bound here is deliberate, not a placeholder - do not raise it without
# re-checking both projects' current Python support.

dependencies = [
    "textual>=8.2.8",
    "pydantic>=2.5",
    "kerykeion>=5.12.0",
    "platformdirs>=4.0",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    # Card art (src/syzygy/resources/art/): rendered as terminal half-block
    # pixels, not a hosted/graphics-protocol dependency - MIT/HPND, no
    # AGPL-compatibility concerns.
    "pillow>=10.3",
    "rich-pixels>=3.0",
    # The bundled knowledge index (M13.3) is a float32 matrix loaded and
    # queried with plain numpy - no vector database, no hosted service,
    # no inference runtime (AGENTS.md). BSD-3, so AGPL-compatible.
    "numpy>=1.26",
]

[project.optional-dependencies]
# Onboarding-only: birthplace geocoding/timezone resolution (DESIGN.md 6.1,
# 46). Never imported by the astrology/reading/oracle path itself.
geocoding = [
    "geopy>=2.4",
    "timezonefinder>=6.5",
]
# Remote LLM providers (DESIGN.md 13.3) - not needed for the fixture
# provider or local-inference path.
providers = [
    "httpx>=0.27",
    "keyring>=25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
syzygy = "syzygy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syzygy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["syzygy"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

# numpy's bundled stubs use 3.12+ `type` statement syntax that breaks
# parsing under this project's py3.11 target - skip following them rather
# than deep-checking a third-party stub file we don't control. Both the
# bare package and the `.*` glob are listed because mypy's per-module
# `follow_imports` doesn't reliably match a direct `import numpy` off the
# glob alone.
#
# `follow_imports_for_stubs` is what makes the skip apply to `.pyi` files
# at all: without it `follow_imports` covers only source modules, so the
# unparseable stub was still read. That went unnoticed while numpy was
# merely transitive (via timezonefinder and Pillow's stubs); it surfaced
# as soon as first-party code imported numpy directly for the knowledge
# vectors (M13.3).
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "numpy", "numpy.*", "timezonefinder.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
